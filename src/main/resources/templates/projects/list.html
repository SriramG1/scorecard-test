<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Projects')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>

    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar('Projects')}"></div>
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4>All Projects</h4>
            <a th:href="@{/projects/new}" class="btn btn-gradient">
                <i class="fas fa-plus me-2"></i>New Project
            </a>
        </div>

        <div th:if="${#lists.isEmpty(projects)}" class="card">
            <div class="card-body text-center py-5">
                <i class="fas fa-project-diagram fa-4x text-muted mb-3"></i>
                <h5 class="text-muted">No projects found</h5>
                <p class="text-muted">Get started by creating your first project</p>
                <a th:href="@{/projects/new}" class="btn btn-gradient">
                    <i class="fas fa-plus me-2"></i>Create Project
                </a>
            </div>
        </div>

        <div th:unless="${#lists.isEmpty(projects)}" class="row">
            <div class="col-md-4 mb-4" th:each="project : ${projects}">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <h5 class="card-title mb-0" th:text="${project.name}">Project Name</h5>
                            <span class="badge"
                                  th:classappend="${project.status.name() == 'ACTIVE'} ? 'bg-success' :
                                                  (${project.status.name() == 'COMPLETED'} ? 'bg-primary' :
                                                  (${project.status.name() == 'ON_HOLD'} ? 'bg-warning' : 'bg-secondary'))"
                                  th:text="${project.status}">Status</span>
                        </div>
                        <p class="card-text text-muted" th:text="${#strings.abbreviate(project.description ?: 'No description', 100)}">Description</p>
                        <div class="mb-3">
                            <small class="text-muted">
                                <i class="fas fa-user me-1"></i>Owner:
                                <span th:text="${project.owner.firstName + ' ' + project.owner.lastName}">Owner</span>
                            </small>
                        </div>
                        <div class="mb-3">
                            <small class="text-muted">
                                <i class="fas fa-users me-1"></i>Members:
                                <span th:text="${project.members.size()}">0</span>
                            </small>
                        </div>
                        <div class="d-flex gap-2" th:if="${project.startDate != null || project.endDate != null}">
                            <small class="text-muted" th:if="${project.startDate != null}">
                                <i class="fas fa-calendar-alt me-1"></i>
                                <span th:text="${#temporals.format(project.startDate, 'MMM dd, yyyy')}">Start</span>
                            </small>
                            <small class="text-muted" th:if="${project.endDate != null}">
                                - <span th:text="${#temporals.format(project.endDate, 'MMM dd, yyyy')}">End</span>
                            </small>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-top-0">
                        <div class="btn-group w-100">
                            <a th:href="@{/projects/{id}(id=${project.id})}" class="btn btn-outline-primary">
                                <i class="fas fa-eye me-1"></i>View
                            </a>
                            <a th:href="@{/projects/{id}/edit(id=${project.id})}" class="btn btn-outline-secondary">
                                <i class="fas fa-edit me-1"></i>Edit
                            </a>
                            <form th:action="@{/projects/{id}/delete(id=${project.id})}" method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this project?');" class="d-inline">
                                <button type="submit" class="btn btn-outline-danger">
                                    <i class="fas fa-trash me-1"></i>Delete
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
