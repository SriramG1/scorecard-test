<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Tasks')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>

    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar('Tasks')}"></div>
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4>All Tasks</h4>
            <a th:href="@{/tasks/new}" class="btn btn-gradient">
                <i class="fas fa-plus me-2"></i>New Task
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <div th:if="${#lists.isEmpty(tasks)}" class="text-center py-5">
                    <i class="fas fa-tasks fa-4x text-muted mb-3"></i>
                    <h5 class="text-muted">No tasks found</h5>
                    <p class="text-muted">Get started by creating your first task</p>
                    <a th:href="@{/tasks/new}" class="btn btn-gradient">
                        <i class="fas fa-plus me-2"></i>Create Task
                    </a>
                </div>

                <div th:unless="${#lists.isEmpty(tasks)}" class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Title</th>
                                <th>Description</th>
                                <th>Status</th>
                                <th>Priority</th>
                                <th>Due Date</th>
                                <th>Assigned To</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="task : ${tasks}">
                                <td>
                                    <strong th:text="${task.title}">Task Title</strong>
                                </td>
                                <td>
                                    <span th:text="${#strings.abbreviate(task.description ?: 'No description', 50)}">Description</span>
                                </td>
                                <td>
                                    <span class="badge badge-status"
                                          th:classappend="${task.status.name() == 'COMPLETED'} ? 'bg-success' :
                                                          (${task.status.name() == 'IN_PROGRESS'} ? 'bg-warning' :
                                                          (${task.status.name() == 'CANCELLED'} ? 'bg-secondary' : 'bg-info'))"
                                          th:text="${task.status}">Status</span>
                                </td>
                                <td>
                                    <span class="badge badge-status"
                                          th:classappend="${task.priority.name() == 'CRITICAL'} ? 'bg-danger' :
                                                          (${task.priority.name() == 'HIGH'} ? 'bg-warning text-dark' :
                                                          (${task.priority.name() == 'LOW'} ? 'bg-secondary' : 'bg-primary'))"
                                          th:text="${task.priority}">Priority</span>
                                </td>
                                <td th:text="${task.dueDate != null} ? ${#temporals.format(task.dueDate, 'MMM dd, yyyy')} : '-'">Due Date</td>
                                <td th:text="${task.assignedTo != null} ? ${task.assignedTo.firstName + ' ' + task.assignedTo.lastName} : '-'">Assigned</td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/tasks/{id}/edit(id=${task.id})}" class="btn btn-sm btn-outline-primary" title="Edit">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <div class="dropdown">
                                            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                                <i class="fas fa-sync-alt"></i>
                                            </button>
                                            <ul class="dropdown-menu">
                                                <li><h6 class="dropdown-header">Change Status</h6></li>
                                                <li th:each="status : ${T(com.test.score.scheduler.entity.Task.Status).values()}">
                                                    <form th:action="@{/tasks/{id}/status(id=${task.id})}" method="post" class="d-inline">
                                                        <input type="hidden" name="status" th:value="${status}">
                                                        <button type="submit" class="dropdown-item" th:text="${status}">Status</button>
                                                    </form>
                                                </li>
                                            </ul>
                                        </div>
                                        <form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post"
                                              onsubmit="return confirm('Are you sure you want to delete this task?');">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
