<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Profile')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>

    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar('My Profile')}"></div>
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="row">
            <div class="col-lg-4">
                <div class="card text-center">
                    <div class="card-body">
                        <div class="user-avatar mx-auto mb-3" style="width: 100px; height: 100px; font-size: 2.5rem;">
                            <span th:text="${#strings.substring(user.firstName, 0, 1).toUpperCase()}">U</span>
                        </div>
                        <h4 th:text="${user.firstName + ' ' + user.lastName}">User Name</h4>
                        <p class="text-muted" th:text="'@' + ${user.username}">@username</p>
                        <span class="badge bg-primary" th:text="${user.role}">Role</span>
                    </div>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Profile Information</h5>
                        <a th:href="@{/profile/edit}" class="btn btn-sm btn-gradient">
                            <i class="fas fa-edit me-1"></i>Edit
                        </a>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="text-muted small">First Name</label>
                                <p class="mb-0" th:text="${user.firstName}">First</p>
                            </div>
                            <div class="col-md-6">
                                <label class="text-muted small">Last Name</label>
                                <p class="mb-0" th:text="${user.lastName}">Last</p>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="text-muted small">Username</label>
                                <p class="mb-0" th:text="${user.username}">username</p>
                            </div>
                            <div class="col-md-6">
                                <label class="text-muted small">Email</label>
                                <p class="mb-0" th:text="${user.email}">email@example.com</p>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="text-muted small">Role</label>
                                <p class="mb-0" th:text="${user.role}">Role</p>
                            </div>
                            <div class="col-md-6">
                                <label class="text-muted small">Member Since</label>
                                <p class="mb-0" th:text="${user.createdAt != null} ? ${#temporals.format(user.createdAt, 'MMM dd, yyyy')} : '-'">Date</p>
                            </div>
                        </div>
                        <hr>
                        <a th:href="@{/profile/change-password}" class="btn btn-outline-primary">
                            <i class="fas fa-key me-2"></i>Change Password
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
