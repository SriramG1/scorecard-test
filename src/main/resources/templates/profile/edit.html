<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Edit Profile')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>

    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar('Edit Profile')}"></div>
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="card">
            <div class="card-body p-4">
                <form th:action="@{/profile/update}" method="post">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" name="firstName" th:value="${user.firstName}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" name="lastName" th:value="${user.lastName}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" th:value="${user.email}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" th:value="${user.username}" disabled>
                        <small class="text-muted">Username cannot be changed</small>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-gradient">
                            <i class="fas fa-save me-2"></i>Update Profile
                        </button>
                        <a th:href="@{/profile}" class="btn btn-outline-secondary">
                            <i class="fas fa-times me-2"></i>Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
