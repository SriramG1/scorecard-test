<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Admin Dashboard')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>

    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar('Admin Dashboard')}"></div>
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card card-stat bg-primary text-white">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="mb-1 opacity-75">Total Users</p>
                            <h3 class="stat-number mb-0" th:text="${users.size()}">0</h3>
                        </div>
                        <i class="fas fa-users"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-stat bg-success text-white">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="mb-1 opacity-75">Active Users</p>
                            <h3 class="stat-number mb-0" th:text="${#lists.size(users.?[enabled])}">0</h3>
                        </div>
                        <i class="fas fa-user-check"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-stat bg-warning text-dark">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="mb-1 opacity-75">Admin Users</p>
                            <h3 class="stat-number mb-0" th:text="${#lists.size(users.?[role.name() == 'ADMIN'])}">0</h3>
                        </div>
                        <i class="fas fa-user-shield"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="fas fa-cog me-2"></i>Quick Actions</h5>
                    </div>
                    <div class="card-body">
                        <a th:href="@{/admin/users}" class="btn btn-outline-primary mb-2 me-2">
                            <i class="fas fa-users me-2"></i>Manage Users
                        </a>
                        <a th:href="@{/h2-console}" target="_blank" class="btn btn-outline-secondary mb-2 me-2">
                            <i class="fas fa-database me-2"></i>H2 Console
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="fas fa-users me-2"></i>Recent Users</h5>
                    </div>
                    <div class="card-body">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between align-items-center" th:each="user : ${users}" th:if="${userStat.index < 5}">
                                <div class="d-flex align-items-center">
                                    <div class="user-avatar me-2" style="width: 35px; height: 35px; font-size: 0.8rem;">
                                        <span th:text="${#strings.substring(user.firstName, 0, 1).toUpperCase()}">U</span>
                                    </div>
                                    <div>
                                        <span th:text="${user.firstName + ' ' + user.lastName}">Name</span>
                                        <br><small class="text-muted" th:text="${user.username}">username</small>
                                    </div>
                                </div>
                                <span class="badge"
                                      th:classappend="${user.role.name() == 'ADMIN'} ? 'bg-danger' : 'bg-secondary'"
                                      th:text="${user.role}">Role</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
