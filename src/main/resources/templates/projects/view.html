<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Project Details')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>

    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar('Project Details')}"></div>
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="row">
            <div class="col-lg-8">
                <div class="card mb-4">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0" th:text="${project.name}">Project Name</h5>
                        <span class="badge"
                              th:classappend="${project.status.name() == 'ACTIVE'} ? 'bg-success' :
                                              (${project.status.name() == 'COMPLETED'} ? 'bg-primary' :
                                              (${project.status.name() == 'ON_HOLD'} ? 'bg-warning' : 'bg-secondary'))"
                              th:text="${project.status}">Status</span>
                    </div>
                    <div class="card-body">
                        <h6 class="text-muted">Description</h6>
                        <p th:text="${project.description ?: 'No description provided'}">Description</p>

                        <div class="row mt-4">
                            <div class="col-md-6">
                                <h6 class="text-muted">Start Date</h6>
                                <p th:text="${project.startDate != null} ? ${#temporals.format(project.startDate, 'MMM dd, yyyy')} : 'Not set'">Start Date</p>
                            </div>
                            <div class="col-md-6">
                                <h6 class="text-muted">End Date</h6>
                                <p th:text="${project.endDate != null} ? ${#temporals.format(project.endDate, 'MMM dd, yyyy')} : 'Not set'">End Date</p>
                            </div>
                        </div>

                        <div class="row mt-2">
                            <div class="col-md-6">
                                <h6 class="text-muted">Owner</h6>
                                <p th:text="${project.owner.firstName + ' ' + project.owner.lastName}">Owner</p>
                            </div>
                            <div class="col-md-6">
                                <h6 class="text-muted">Created At</h6>
                                <p th:text="${project.createdAt != null} ? ${#temporals.format(project.createdAt, 'MMM dd, yyyy HH:mm')} : '-'">Created</p>
                            </div>
                        </div>

                        <div class="mt-4">
                            <a th:href="@{/projects/{id}/edit(id=${project.id})}" class="btn btn-gradient">
                                <i class="fas fa-edit me-2"></i>Edit Project
                            </a>
                            <a th:href="@{/projects}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Back to Projects
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card">
                    <div class="card-header bg-white">
                        <h6 class="mb-0">Team Members</h6>
                    </div>
                    <div class="card-body">
                        <!-- Add Member Form -->
                        <form th:action="@{/projects/{id}/members/add(id=${project.id})}" method="post" class="mb-3">
                            <div class="input-group">
                                <select class="form-select" name="userId" required>
                                    <option value="">Select member...</option>
                                    <option th:each="user : ${users}"
                                            th:value="${user.id}"
                                            th:text="${user.firstName + ' ' + user.lastName}">User</option>
                                </select>
                                <button type="submit" class="btn btn-gradient">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                        </form>

                        <div th:if="${#lists.isEmpty(project.members)}" class="text-center py-3">
                            <i class="fas fa-users fa-2x text-muted mb-2"></i>
                            <p class="text-muted mb-0">No members yet</p>
                        </div>

                        <ul th:unless="${#lists.isEmpty(project.members)}" class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between align-items-center" th:each="member : ${project.members}">
                                <div class="d-flex align-items-center">
                                    <div class="user-avatar me-2" style="width: 35px; height: 35px; font-size: 0.8rem;">
                                        <span th:text="${#strings.substring(member.firstName, 0, 1).toUpperCase()}">M</span>
                                    </div>
                                    <div>
                                        <span th:text="${member.firstName + ' ' + member.lastName}">Member Name</span>
                                        <br><small class="text-muted" th:text="${member.email}">email</small>
                                    </div>
                                </div>
                                <form th:action="@{/projects/{id}/members/{userId}/remove(id=${project.id}, userId=${member.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Remove">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
