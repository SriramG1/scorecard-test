<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Manage Users')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>

    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar('Manage Users')}"></div>
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>User</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td>
                                    <div class="d-flex align-items-center">
                                        <div class="user-avatar me-2" style="width: 35px; height: 35px; font-size: 0.8rem;">
                                            <span th:text="${#strings.substring(user.firstName, 0, 1).toUpperCase()}">U</span>
                                        </div>
                                        <div>
                                            <strong th:text="${user.firstName + ' ' + user.lastName}">Name</strong>
                                            <br><small class="text-muted" th:text="'@' + ${user.username}">username</small>
                                        </div>
                                    </div>
                                </td>
                                <td th:text="${user.email}">email</td>
                                <td>
                                    <form th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post" class="d-inline">
                                        <select name="role" class="form-select form-select-sm" style="width: auto;" onchange="this.form.submit()">
                                            <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"
                                                    th:selected="${user.role == role}">Role</option>
                                        </select>
                                    </form>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="${user.enabled} ? 'bg-success' : 'bg-danger'"
                                          th:text="${user.enabled} ? 'Active' : 'Disabled'">Status</span>
                                </td>
                                <td th:text="${user.createdAt != null} ? ${#temporals.format(user.createdAt, 'MMM dd, yyyy')} : '-'">Date</td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <form th:action="@{/admin/users/{id}/toggle-status(id=${user.id})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm"
                                                    th:classappend="${user.enabled} ? 'btn-outline-warning' : 'btn-outline-success'"
                                                    th:title="${user.enabled} ? 'Disable User' : 'Enable User'">
                                                <i class="fas" th:classappend="${user.enabled} ? 'fa-ban' : 'fa-check'"></i>
                                            </button>
                                        </form>
                                        <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post"
                                              onsubmit="return confirm('Are you sure you want to delete this user?');" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete User">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/admin}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-2"></i>Back to Admin Dashboard
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
